[project]
name = "fastapi-student-management"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<3.15"
authors = [
    { name = "sigma" }
]
dependencies = [
    "fastapi (>=0.163.1,<0.164.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "boto3 (>=1.44.3,<2.0.0)",
    "python-multipart (>=0.0.34,<0.0.35)",
    "alembic (>=1.20.1,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "email-validator (>=2.4.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "ruff (>=0.17.5,<0.18.0)"
]