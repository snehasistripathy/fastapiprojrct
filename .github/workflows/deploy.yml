
name: FastAPI CI/CD - EKS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-fastapi-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to EKS
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
      CONTAINER_NAME: student-fastapi

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Authenticate and assume the deployment IAM role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "654691200479"

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build and push Docker image using full Git commit SHA
      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building image: $IMAGE_URI"

          docker build --pull -t "$IMAGE_URI" .

          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # 6. Get the Kubernetes version used by EKS
      - name: Get EKS Kubernetes version
        id: eks-version
        run: |
          VERSION=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.version' \
            --output text)

          echo "version=v${VERSION}.0" >> "$GITHUB_OUTPUT"

      # 7. Install compatible kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.eks-version.outputs.version }}

      # 8. Configure Kubernetes access
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # 9. Deploy the new Docker image
      - name: Deploy to EKS
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME=$IMAGE_URI" \
            -n "$K8S_NAMESPACE"

      # 10. Wait for successful deployment
      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      # 11. Display running pods
      - name: Check running pods
        run: |
          kubectl get pods -n "$K8S_NAMESPACE" -o wide

          kubectl get deployment "$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE"
