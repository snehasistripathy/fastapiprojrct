
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-fastapi-ingress
  namespace: student-fastapi

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: student-fastapi-service
                port:
                  number: 8000
