
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-fastapi
  namespace: student-fastapi

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-fastapi

  template:
    metadata:
      labels:
        app: student-fastapi

    spec:
      containers:
        - name: student-fastapi

          image: 654691200479.dkr.ecr.ap-south-1.amazonaws.com/fastapi/studentmanagement:v2

          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - configMapRef:
                name: student-fastapi-config

            - secretRef:
                name: student-fastapi-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
